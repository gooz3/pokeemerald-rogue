name: CI

on:
  push:
    branches:
      - gooz3-release
  pull_request:
    branches:
      - gooz3-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear persisted git credentials
        # actions/checkout's persist-credentials:false runs `git submodule foreach`,
        # which fails on the inherited orphaned `agbcc` gitlink (no .gitmodules).
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || {
            status=$?
            if [ "$status" -ne 5 ]; then
              exit "$status"
            fi
          }

      - name: Lint shell scripts
        run: |
          shellcheck scripts/build_nix.sh scripts/smoke_test.sh scripts/smoke_test_nix.sh scripts/test_ci_scripts.sh

      - name: Check Python & CI helper scripts
        run: |
          python3 -m py_compile scripts/memory_report.py
          scripts/test_ci_scripts.sh

  build:
    name: Build & Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            release: 1
          - name: Debug
            release: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear persisted git credentials
        # actions/checkout's persist-credentials:false runs `git submodule foreach`,
        # which fails on the inherited orphaned `agbcc` gitlink (no .gitmodules).
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || {
            status=$?
            if [ "$status" -ne 5 ]; then
              exit "$status"
            fi
          }

      - name: Plan APT packages
        id: apt_cache
        run: |
          set -euo pipefail
          printf '%s\n' gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            build-essential libpng-dev libelf-dev zlib1g-dev unzip wget mgba-sdl \
            > "$RUNNER_TEMP/ci-apt-packages"
          sudo apt-get update
          . /etc/os-release
          echo "scope=${ID}-${VERSION_ID}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          # Hash the exact .debs APT plans to download, so a package update opens a new cache entry.
          plan=$(xargs -a "$RUNNER_TEMP/ci-apt-packages" \
            apt-get install --print-uris -qq --no-install-recommends | awk '{print $2}' | sort | sha256sum | cut -c1-16)
          echo "package_plan_hash=$plan" >> "$GITHUB_OUTPUT"

      # Cache downloaded .debs only; packages are installed normally each run.
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-apt-archives/*.deb
          key: ci-apt-${{ steps.apt_cache.outputs.scope }}-${{ runner.arch }}-${{ steps.apt_cache.outputs.package_plan_hash }}
          restore-keys: |
            ci-apt-${{ steps.apt_cache.outputs.scope }}-${{ runner.arch }}-

      - name: Install toolchain and emulator
        run: |
          set -euo pipefail
          archives="$RUNNER_TEMP/ci-apt-archives"
          mkdir -p "$archives/partial"
          xargs -a "$RUNNER_TEMP/ci-apt-packages" sudo apt-get -o Dir::Cache::archives="$archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends

      - name: Cache Linux Poryscript archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/poryscript-linux.zip
          key: poryscript-archive-${{ runner.os }}-${{ runner.arch }}-3.0.2-1080c2c48a01

      - name: Fetch and verify Linux Poryscript
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/poryscript-linux.zip"
          checksum='1080c2c48a0122f72e3325e0419ea5689ccd40bf4be3ffa2bb1cdee99abf53e6'
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          if [ ! -f "$archive" ] || ! printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c -; then
            wget -nv -O "$tmp_dir/poryscript-linux.zip" \
              https://github.com/huderlem/poryscript/releases/download/3.0.2/poryscript-linux.zip
            printf '%s  %s\n' "$checksum" "$tmp_dir/poryscript-linux.zip" | sha256sum -c -
            mv "$tmp_dir/poryscript-linux.zip" "$archive"
          fi
          unzip -q "$archive" -d "$tmp_dir/out"
          rm -rf tools/poryscript/poryscript-linux
          mkdir -p tools/poryscript
          mv "$tmp_dir/out/poryscript-linux" tools/poryscript/poryscript-linux
          test -x tools/poryscript/poryscript-linux/poryscript

      - name: Build ${{ matrix.name }} ROM
        id: build_rom
        run: |
          make -j"$(nproc)" -O MODERN=1 COMPARE=0 RELEASE=${{ matrix.release }} UNUSED_ERROR=0 all

      - name: Headless mGBA title-screen smoke test
        run: scripts/smoke_test.sh emerogue.gba 60

      - name: Memory usage report & headroom gate
        if: ${{ !cancelled() && steps.build_rom.outcome == 'success' }}
        run: |
          python3 scripts/memory_report.py emerogue.map \
            --label "${{ matrix.name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --max-ewram-pct 99.5 \
            --max-iwram-pct 85.0 \
            --max-rom-pct 99.5
