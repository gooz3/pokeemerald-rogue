name: CI

on:
  push:
    branches:
      - gooz3-release
  pull_request:
    branches:
      - gooz3-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Script & PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Clear persisted git credentials
        # actions/checkout's persist-credentials:false runs `git submodule foreach`,
        # which fails on the inherited orphaned `agbcc` gitlink (no .gitmodules).
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || {
            status=$?
            if [ "$status" -ne 5 ]; then
              exit "$status"
            fi
          }

      - name: Lint shell scripts
        run: |
          shellcheck scripts/build_nix.sh scripts/smoke_test.sh scripts/smoke_test_nix.sh scripts/test_ci_scripts.sh

      - name: Check Python & CI helper scripts
        run: |
          python3 -m py_compile scripts/memory_report.py
          scripts/test_ci_scripts.sh

      - name: Check save-layout files on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if ! git rev-parse --verify -q HEAD^1 >/dev/null || ! git rev-parse --verify -q HEAD^2 >/dev/null; then
            {
              echo "### Save Compatibility Check"
              echo ""
              echo "> [!WARNING]"
              echo "> Could not determine the PR merge commit parents in this checkout. Manually verify whether save-related files were modified."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CHANGED=$(git diff --no-renames --name-only HEAD^1 HEAD)
          if grep -Eq '^(include/(config|rogue|rogue_save|global|global\.(berry|fieldmap|tv)|save|pokemon_storage_system|pokemon|hall_of_fame|ereader_helpers|trainer_hill|recorded_battle)\.h|include/(config|constants)/.+\.h|src/(rogue_save|save|hall_of_fame|ereader_helpers|recorded_battle)\.c|data/maps/map_groups\.json|data/layouts/layouts\.json|src/data/region_map/region_map_sections\.json(\.txt)?|src/data/rogue/((decorations|quests)(\.json|/[^/]+\.json)|custom_mons\.json)|tools/(Pokabbie/Build/CustomJson|mapjson|jsonproc)/.+)$' <<<"$CHANGED"; then
            {
              echo "### Save Compatibility Check"
              echo ""
              echo "> [!WARNING]"
              echo "> This PR modifies save-related code. Verify field order, struct sizes, and serialized save compatibility — or bump \`ROGUE_SAVE_VERSION\` and update migration/assert logic."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build & Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            release: 1
          - name: Debug
            release: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear persisted git credentials
        # actions/checkout's persist-credentials:false runs `git submodule foreach`,
        # which fails on the inherited orphaned `agbcc` gitlink (no .gitmodules).
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || {
            status=$?
            if [ "$status" -ne 5 ]; then
              exit "$status"
            fi
          }

      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            libpng-dev \
            libelf-dev \
            zlib1g-dev \
            unzip \
            wget \
            mgba-sdl

      - name: Cache Poryscript & UPS tools
        uses: actions/cache@v4
        with:
          path: |
            tools/poryscript
            tools/ups
          key: deps-${{ runner.os }}-${{ hashFiles('init_deps.sh') }}

      - name: Fetch build dependencies
        run: |
          ./init_deps.sh
          test -x tools/poryscript/poryscript-linux/poryscript

      - name: Build ${{ matrix.name }} ROM
        id: build_rom
        run: |
          make -j"$(nproc)" -O MODERN=1 COMPARE=0 RELEASE=${{ matrix.release }} UNUSED_ERROR=0 all

      - name: Headless mGBA title-screen smoke test
        run: scripts/smoke_test.sh emerogue.gba 60

      - name: Memory usage report & headroom gate
        if: ${{ !cancelled() && steps.build_rom.outcome == 'success' }}
        run: |
          python3 scripts/memory_report.py emerogue.map \
            --label "${{ matrix.name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --max-ewram-pct 99.5 \
            --max-iwram-pct 90.0 \
            --max-rom-pct 99.5
