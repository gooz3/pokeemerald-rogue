name: CI

on:
  push:
    branches:
      - gooz3-release
  pull_request:
    branches:
      - gooz3-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Script & PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck scripts/build_nix.sh scripts/smoke_test.sh scripts/smoke_test_nix.sh

      - name: Check Python scripts
        run: |
          python3 -m py_compile scripts/memory_report.py

      - name: Check save-layout files on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL_FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.changed_files')
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[] | (.filename, (.previous_filename // empty))')
          if [ "$TOTAL_FILES" -gt 3000 ]; then
            {
              echo "### Save Compatibility Check"
              echo ""
              echo "> [!WARNING]"
              echo "> This PR changes ${TOTAL_FILES} files (exceeding the GitHub API 3,000-file list limit). Manually verify whether save-related files were modified."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -Eq '^(include/((rogue|rogue_save|global|global\.berry|save|pokemon_storage_system|pokemon)|constants/(global|flags|vars|rogue|rogue_hub))\.h|src/(rogue_save|save)\.c)$' <<<"$CHANGED"; then
            {
              echo "### Save Compatibility Check"
              echo ""
              echo "> [!WARNING]"
              echo "> This PR modifies save-related code. Verify field order, struct sizes, and serialized save compatibility — or bump \`ROGUE_SAVE_VERSION\` and update migration/assert logic."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build & Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            release: 1
          - name: Debug
            release: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            libpng-dev \
            libelf-dev \
            zlib1g-dev \
            unzip \
            wget \
            mgba-sdl

      - name: Cache Poryscript & UPS tools
        uses: actions/cache@v4
        with:
          path: |
            tools/poryscript
            tools/ups
          key: deps-${{ runner.os }}-${{ hashFiles('init_deps.sh') }}

      - name: Fetch build dependencies
        run: |
          ./init_deps.sh
          test -x tools/poryscript/poryscript-linux/poryscript

      - name: Build ${{ matrix.name }} ROM
        id: build_rom
        run: |
          make -j"$(nproc)" -O MODERN=1 COMPARE=0 RELEASE=${{ matrix.release }} UNUSED_ERROR=0 all

      - name: Headless mGBA title-screen smoke test
        run: scripts/smoke_test.sh emerogue.gba 60

      - name: Memory usage report & headroom gate
        if: ${{ !cancelled() && steps.build_rom.outcome == 'success' }}
        run: |
          python3 scripts/memory_report.py emerogue.map \
            --label "${{ matrix.name }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --max-ewram-pct 99.5 \
            --max-iwram-pct 90.0 \
            --max-rom-pct 99.5
